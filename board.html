<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Priora</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/board.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
</head>

<body class="page-board">

    <header>
        <a href="index.html" class="btn-home" aria-label="Back to home">Home</a>
        <h1>Priora</h1>

        <div class="header__settings">
            <button class="btn-settings" id="btnSettings" aria-label="Settings">
                <svg class="gear" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </button>
            <div class="settings-popover" id="settingsPopover">
                <button class="settings-popover__btn" id="btnExport">
                    <span>↓</span> Export
                </button>
                <button class="settings-popover__btn" id="btnImport">
                    <span>↑</span> Import
                </button>
                <button class="settings-popover__btn settings-popover__btn--edit" id="btnEdit">
                    <span>✎</span> Edit
                </button>
                <input type="file" id="importFileInput" accept=".json" style="display:none;" />
            </div>
        </div>
    </header>

    <div class="layout">

        <div class="sidebar-wrapper">

            <aside class="sidebar" aria-label="My boards">
                <h2 class="sidebar__title">My boards</h2>
                <nav>
                    <ul class="sidebar__list">
                    </ul>
                </nav>
            </aside>

            <button class="btn-sidebar-toggle btn-sidebar--collapse" aria-label="Collapse sidebar">&#8249;</button>
            <button class="btn-sidebar-toggle btn-sidebar--expand" aria-label="Expand sidebar"
                style="display: none;">&#8250;</button>

        </div>

        <main class="kanban">

            <h2 class="kanban__title"></h2>

            <div class="kanban__columns">

                <section class="column" aria-label="To-Do">
                    <div class="column__header">
                        <h3 class="column__title">To-Do</h3>
                        <span class="column__count">0</span>
                    </div>
                    <div class="column__cards"></div>
                    <button class="btn-add-card">+ Add a card</button>
                </section>

                <section class="column" aria-label="In Progress">
                    <div class="column__header">
                        <h3 class="column__title">In Progress</h3>
                        <span class="column__count">0</span>
                    </div>
                    <div class="column__cards"></div>
                    <button class="btn-add-card">+ Add a card</button>
                </section>

                <section class="column" aria-label="Done">
                    <div class="column__header">
                        <h3 class="column__title">Done</h3>
                        <span class="column__count">0</span>
                    </div>
                    <div class="column__cards"></div>
                    <button class="btn-add-card">+ Add a card</button>
                </section>

            </div>

        </main>

    </div>

    <footer>
        <p>Priora &nbsp;•&nbsp; 2026</p>
    </footer>

    <div class="modal-overlay" id="newCardModal" aria-modal="true" role="dialog" aria-label="Add a card">
        <div class="modal">

            <div class="modal__header">
                <h2 class="modal__title">New card</h2>
                <button class="modal__close" aria-label="Close">&times;</button>
            </div>

            <div class="modal__body">

                <div class="field">
                    <label class="field__label" for="cardTitle">Title</label>
                    <input class="field__input" type="text" id="cardTitle" placeholder="Ex: Choose the color palette…"
                        maxlength="80" />
                </div>

                <div class="field">
                    <label class="field__label" for="cardDescription">Description</label>
                    <textarea class="field__input field__textarea" id="cardDescription" placeholder="Describe the task…"
                        rows="3"></textarea>
                </div>

                <div class="field">
                    <label class="field__label" for="cardAnnotation">
                        <span class="field__label-icon">📝</span> Annotation
                    </label>
                    <textarea class="field__input field__textarea field__textarea--annotation" id="cardAnnotation"
                        placeholder="A quick note, an idea on the fly…" rows="2"></textarea>
                </div>

            </div>

            <div class="modal__footer">
                <button class="btn-secondary" id="cancelNewCard">Cancel</button>
                <button class="btn-primary">Add card</button>
            </div>

        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/board.js"></script>
</body>

</html>
